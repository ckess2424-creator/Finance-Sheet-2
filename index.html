<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>💰 Finance App</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <!-- CSS -->
  <link rel="stylesheet" href="styles.css">

  <!-- Chart.js (REQUIRED) -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>

<body>

<div class="container">
  <h1>💰 Finance Tracker</h1>

  <!-- Tabs -->
  <div class="tabs">
    <button class="tab-btn active" data-tab="expenses">Expenses</button>
    <button class="tab-btn" data-tab="balances">Balances</button>
  </div>

  <!-- EXPENSES -->
  <div id="expenses" class="tab-content active">
    <h2>Add Expense</h2>

    <input type="text" id="category" placeholder="Category">
    <input type="number" id="amount" placeholder="Amount">
    <button onclick="app.addExpense()">Add</button>

    <div id="expensesList"></div>
  </div>

  <!-- BALANCES -->
  <div id="balances" class="tab-content">
    <h2>Balance</h2>

    <input type="number" id="balanceInput" placeholder="Enter balance">
    <button onclick="app.updateBalance()">Save</button>

    <h3 id="balanceDisplay">$0</h3>
  </div>

</div>

<!-- JS -->
<script src="app.js"></script>

</body>
</html>
